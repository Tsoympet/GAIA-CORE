[project]
name = "gaia-core"
version = "0.1.0"
description = "GAIA local-first autonomous intelligence foundation modules."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "GAIA Contributors" }]
keywords = ["ai", "agents", "orchestration", "local-first", "fastapi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0",
  "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
]

[project.scripts]
gaia = "gaia.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["gaia"]
