[project]
name = "gaia-core"
version = "0.1.0"
description = "GAIA local-first autonomous intelligence foundation modules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "httpx>=0.27",
  "uvicorn[standard]>=0.29"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
